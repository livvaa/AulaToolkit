appId: dev.aulatoolkit.app
productName: AULA Toolkit
publish:
  provider: github
  owner: livvaa
  repo: AulaToolkit
  releaseType: release
directories:
  output: release
files:
  - out/**
  - package.json
  - resources/icon.png
extraResources:
  - from: resources/display-watch.ps1
    to: display-watch.ps1
  - from: resources/media-watch.ps1
    to: media-watch.ps1
  - from: resources/vendor-restore.ps1
    to: vendor-restore.ps1
  - from: resources/cli
    to: cli
  - from: resources/bin
    to: bin
asarUnpack:
  - "**/node_modules/node-hid/**"
win:
  target:
    - nsis
    - portable
  icon: resources/icon.ico
nsis:
  artifactName: AULA-Toolkit-Setup-${version}.${ext}
  license: LICENSE
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  include: resources/installer.nsh
portable:
  artifactName: AULA-Toolkit-${version}-portable.${ext}
